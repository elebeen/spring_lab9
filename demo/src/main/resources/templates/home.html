<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inicio</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 2em; background-color: #f4f4f4; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 1em; background: white; }
        th, td { padding: 0.8em; border: 1px solid #ccc; text-align: left; }
        th { background-color: #e8e8e8; }
        a, button { padding: 0.5em 1em; margin-right: 0.5em; text-decoration: none; border: none; border-radius: 4px; }
        .edit { background-color: #4CAF50; color: white; }
        .delete { background-color: #f44336; color: white; }
        .add { background-color: #2196F3; color: white; float: right; margin-bottom: 1em; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<div id="confirmModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; 
    background: rgba(0, 0, 0, 0.5); justify-content:center; align-items:center;">
    <div style="background:white; padding:2em; border-radius:8px; width:300px; text-align:center;">
        <p>¿Estás seguro de que deseas eliminar este producto?</p>
        <button onclick="confirmDelete()" style="background-color:#f44336; color:white; padding:0.5em 1em; border:none; border-radius:4px;">Sí, eliminar</button>
        <button onclick="closeModal()" style="margin-left:1em; padding:0.5em 1em;">Cancelar</button>
    </div>
</div>
<script>
    let formToSubmit = null;

    function showModal(form) {
        formToSubmit = form;
        document.getElementById('confirmModal').style.display = 'flex';
    }

    function closeModal() {
        formToSubmit = null;
        document.getElementById('confirmModal').style.display = 'none';
    }

    function confirmDelete() {
        if (formToSubmit) {
            formToSubmit.submit();
        }
    }
</script>
<body>

    <h1>Bienvenido, <span th:text="${username}">Usuario</span></h1>

    <a th:href="@{/home/create}" class="add">+ Añadir producto</a>

    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Categoría</th>
                <th>Stock</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.name}">Nombre</td>
                <td th:text="${product.description}">Descripción</td>
                <td th:text="${product.price}">Precio</td>
                <td th:text="${product.category.name}">Categoría</td>
                <td th:text="${product.stockQuantity}">Stock</td>
                <td>
                    <a th:href="@{/home/edit/{id}(id=${product.id})}" class="icon-button edit" title="Editar">
                        <i class="fas fa-pen"></i>
                    </a>

                    <form th:action="@{/home/delete/{id}(id=${product.id})}" method="post"
                        th:id="'deleteForm-' + ${product.id}" style="display:inline;">
                        <button type="button" class="icon-button delete" th:onclick="'showModal(this.form)'" title="Eliminar">
                            <i class="fas fa-trash"></i>
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(products)}">
                <td colspan="6" style="text-align: center;">No tienes productos registrados aún.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
