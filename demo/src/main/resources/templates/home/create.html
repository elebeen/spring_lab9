<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Producto</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 2em; background-color: #f9f9f9; }
        h1 { color: #333; }
        form { background: white; padding: 2em; border-radius: 8px; width: 400px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        label { display: block; margin-bottom: 0.3em; color: #555; }
        input, select, textarea { width: 100%; padding: 0.6em; margin-bottom: 1em; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #2196F3; color: white; border: none; padding: 0.7em 1.5em; border-radius: 4px; cursor: pointer; }
        a { display: block; text-align: center; margin-top: 1em; color: #2196F3; text-decoration: none; }
    </style>
</head>
<body>

<h1 style="text-align: center;">Crear Nuevo Producto</h1>

<form th:action="@{/home/create}" method="post" th:object="${product}">
    <label for="name">Nombre</label>
    <input type="text" th:field="*{name}" placeholder="Nombre del producto" required />

    <label for="description">Descripción</label>
    <textarea th:field="*{description}" placeholder="Describe el producto" required></textarea>

    <label for="price">Precio</label>
    <input type="number" step="0.01" th:field="*{price}" placeholder="Precio" required />

    <label for="category">Categoría</label>
    <select th:field="*{category.id}" required>
        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Categoría</option>
    </select>

    <label for="stockQuantity">Cantidad en stock</label>
    <input type="number" th:field="*{stockQuantity}" placeholder="Cantidad disponible" required />

    <button type="submit">Guardar</button>
</form>

<a th:href="@{/home}">← Volver al inicio</a>

</body>
</html>
