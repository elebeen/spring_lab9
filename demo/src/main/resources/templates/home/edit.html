<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Producto</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .edit-card {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border: none;
        }
        .edit-header {
            background-color: #4CAF50;
            color: white;
            border-radius: 10px 10px 0 0 !important;
        }
        .btn-submit {
            background-color: #4CAF50;
            border: none;
            width: 100%;
            padding: 10px;
            font-weight: 500;
        }
        .btn-submit:hover {
            background-color: #3e8e41;
        }
        .form-control:focus {
            border-color: #81c784;
            box-shadow: 0 0 0 0.25rem rgba(76, 175, 80, 0.25);
        }
        .back-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #4CAF50;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #3e8e41;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card edit-card">
            <div class="card-header edit-header text-center py-3">
                <h2><i class="fas fa-edit me-2"></i>Editar Producto</h2>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/home/edit/{id}(id=${product.id})}" method="post" th:object="${product}">
                    <div class="mb-3">
                        <label for="name" class="form-label">
                            <i class="fas fa-tag me-2"></i>Nombre del Producto
                        </label>
                        <input type="text" 
                               class="form-control" 
                               id="name" 
                               th:field="*{name}"
                               placeholder="Ingrese el nombre del producto"
                               required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">
                            <i class="fas fa-align-left me-2"></i>Descripción
                        </label>
                        <textarea class="form-control" 
                                  id="description" 
                                  th:field="*{description}"
                                  rows="3"
                                  placeholder="Describa el producto"
                                  required></textarea>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="price" class="form-label">
                                <i class="fas fa-dollar-sign me-2"></i>Precio
                            </label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" 
                                       step="0.01" 
                                       class="form-control" 
                                       id="price" 
                                       th:field="*{price}"
                                       placeholder="0.00"
                                       required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="stockQuantity" class="form-label">
                                <i class="fas fa-boxes me-2"></i>Stock
                            </label>
                            <input type="number" 
                                   class="form-control" 
                                   id="stockQuantity" 
                                   th:field="*{stockQuantity}"
                                   placeholder="Cantidad disponible"
                                   required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="category" class="form-label">
                            <i class="fas fa-list me-2"></i>Categoría
                        </label>
                        <select class="form-select" 
                                id="category" 
                                th:field="*{category.id}"
                                required>
                            <option value="" disabled>Seleccione una categoría</option>
                            <option th:each="cat : ${categories}" 
                                    th:value="${cat.id}" 
                                    th:text="${cat.name}"
                                    th:selected="${cat.id == product.category.id}">
                            </option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-submit btn-success mb-3">
                        <i class="fas fa-save me-2"></i>Actualizar Producto
                    </button>
                </form>
                
                <a th:href="@{/home}" class="back-link">
                    <i class="fas fa-arrow-left me-2"></i>Volver al inicio
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
