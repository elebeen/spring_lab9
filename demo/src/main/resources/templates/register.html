<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de Usuario</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
        }
        .register-card {
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border: none;
        }
        .register-header {
            background-color: #28a745;
            color: white;
            border-radius: 10px 10px 0 0 !important;
        }
        .btn-register {
            background-color: #28a745;
            border: none;
            width: 100%;
            padding: 10px;
            font-weight: 500;
        }
        .btn-register:hover {
            background-color: #218838;
        }
        .form-control:focus {
            border-color: #28a745;
            box-shadow: 0 0 0 0.25rem rgba(40, 167, 69, 0.25);
        }
        .password-requirements {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 5px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card register-card">
            <div class="card-header register-header text-center py-3">
                <h2><i class="fas fa-user-plus me-2"></i>Registro de Usuario</h2>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/register}" th:object="${user}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            <i class="fas fa-user me-2"></i>Nombre de Usuario
                        </label>
                        <input type="text" 
                               class="form-control" 
                               id="username" 
                               th:field="*{username}"
                               placeholder="Ingrese su nombre de usuario"
                               required>
                        <div class="form-text">El nombre de usuario debe tener entre 4 y 20 caracteres.</div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock me-2"></i>Contraseña
                        </label>
                        <input type="password" 
                               class="form-control" 
                               id="password" 
                               th:field="*{password}"
                               placeholder="Ingrese su contraseña"
                               required>
                        <div class="password-requirements">
                            <i class="fas fa-info-circle me-1"></i>
                            La contraseña debe tener al menos 6 caracteres.
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-register btn-success mb-3">
                        <i class="fas fa-user-plus me-2"></i>Registrarse
                    </button>
                    
                    <div class="text-center mt-3">
                        <p class="mb-0">¿Ya tienes una cuenta? <a th:href="@{/login}" class="text-decoration-none">Inicia sesión</a></p>
                    </div>
                </form>

                <!-- Mensaje de error -->
                <div th:if="${error}" class="alert alert-danger mt-3 mb-0">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span th:text="${error}"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
